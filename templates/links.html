<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>きしもとカラダcondiTion｜公式リンク</title>
<meta name="description" content="神戸市垂水区舞子の整体・姿勢改善・骨盤矯正「きしもとカラダcondiTion」の公式リンクページ。ホームページ・ご予約・アクセスはこちらから。">
<meta property="og:title" content="きしもとカラダcondiTion｜公式リンク">
<meta property="og:description" content="ホームページ・ご予約・アクセスはこちらから">
<meta property="og:type" content="website">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary:    #2e8b6e;
  --primary-dk: #1f6b52;
  --primary-lt: #e8f5f1;
  --accent:     #f0a500;
  --bg:         #f7f9f8;
  --card:       #ffffff;
  --text:       #2c3e35;
  --muted:      #7a9088;
  --border:     #dde8e4;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
               "Noto Sans JP", sans-serif;
  background: linear-gradient(160deg, var(--primary-lt) 0%, var(--bg) 45%);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
}
.wrap { max-width: 460px; margin: 0 auto; padding: 36px 20px 48px; }

.profile { text-align: center; margin-bottom: 26px; }
.profile .mark {
  width: 72px; height: 72px;
  margin: 0 auto 14px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
  box-shadow: 0 4px 14px rgba(46,139,110,.35);
}
.profile h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; color: var(--primary-dk); }
.profile p  { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

.links { display: flex; flex-direction: column; gap: 14px; }
.link-btn {
  display: flex; align-items: center; gap: 14px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  text-decoration: none;
  color: var(--text);
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
  transition: transform .12s, box-shadow .12s;
}
.link-btn:active { transform: scale(.98); }
.link-btn .icon {
  width: 42px; height: 42px; flex-shrink: 0;
  border-radius: 10px;
  background: var(--primary-lt);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.link-btn .body { flex: 1; min-width: 0; }
.link-btn .title { font-size: 15px; font-weight: 700; }
.link-btn .sub   { font-size: 12px; color: var(--muted); margin-top: 1px; }
.link-btn .arrow { color: var(--muted); font-size: 18px; }

.link-btn.main {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
  box-shadow: 0 4px 16px rgba(46,139,110,.35);
}
.link-btn.main .icon  { background: rgba(255,255,255,.18); }
.link-btn.main .sub   { color: rgba(255,255,255,.8); }
.link-btn.main .arrow { color: rgba(255,255,255,.8); }

.footer { text-align: center; margin-top: 30px; font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>

<div class="wrap">

  <div class="profile">
    <div class="mark">🌿</div>
    <h1>きしもとカラダcondiTion</h1>
    <p>神戸市垂水区舞子｜整体・姿勢改善・骨盤矯正</p>
  </div>

  <div class="links">

    <a class="link-btn main" href="/go/home">
      <span class="icon">🏠</span>
      <span class="body">
        <span class="title">きしもとカラダcondiTionをチェック</span><br>
        <span class="sub">施術内容・料金・お店の詳しい情報はこちら</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="link-btn" href="/go/seitai">
      <span class="icon">📅</span>
      <span class="body">
        <span class="title">整体のご予約</span><br>
        <span class="sub">24時間ネット予約OK（約45分）</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="link-btn" href="/go/hoken">
      <span class="icon">🩺</span>
      <span class="body">
        <span class="title">保険診療のご予約</span><br>
        <span class="sub">月・水・木・金・土 11:00〜21:30</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="link-btn" href="/go/tel">
      <span class="icon">📞</span>
      <span class="body">
        <span class="title">電話で問い合わせ</span><br>
        <span class="sub">{{ phone }}</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="link-btn" href="/go/map">
      <span class="icon">📍</span>
      <span class="body">
        <span class="title">アクセス・地図</span><br>
        <span class="sub">Googleマップで場所を確認</span>
      </span>
      <span class="arrow">›</span>
    </a>

  </div>

  <div class="footer">© きしもとカラダcondiTion</div>

</div>

<script>
// ?src=story などの流入元パラメータを /go/ リンクに引き継ぐ
(function () {
  const src = new URLSearchParams(location.search).get("src");
  if (!src) return;
  document.querySelectorAll('a[href^="/go/"]').forEach(a => {
    a.href += "?src=" + encodeURIComponent(src);
  });
})();
</script>

</body>
</html>
