<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>姿勢・痛みチェック管理 | きしもとカラダcondiTion</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header class="admin-header">
  <div class="title">📋 姿勢・痛みチェック管理</div>
  <div style="display:flex;gap:8px">
    <a class="btn btn-outline btn-sm" href="/admin" style="color:#fff;border-color:#fff;text-decoration:none">予約管理へ</a>
    <button class="btn btn-outline btn-sm" onclick="doLogout()" style="color:#fff;border-color:#fff">ログアウト</button>
  </div>
</header>

<div class="admin-container">

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px">
      <div class="card-title" style="margin-bottom:0">回答一覧</div>
      <label style="font-size:13px;color:var(--muted)">
        <input type="checkbox" id="filter-new" onchange="renderList()"> 未対応のみ表示
      </label>
    </div>
    <div style="overflow-x:auto">
      <table class="res-table">
        <thead>
          <tr>
            <th>受付日時</th><th>お名前</th><th>年代</th><th>部位</th>
            <th>痛み</th><th>姿勢</th><th>状態</th>
          </tr>
        </thead>
        <tbody id="assess-tbody"></tbody>
      </table>
    </div>
    <p id="assess-empty" class="hidden" style="text-align:center;color:var(--muted);font-size:13px;padding:20px 0">
      まだ回答はありません
    </p>
  </div>

</div>

<!-- 詳細モーダル -->
<div class="modal-overlay hidden" id="detail-modal">
  <div class="modal" style="max-width:560px">
    <div class="modal-title" id="detail-title"></div>
    <div id="detail-body" style="font-size:13px"></div>
    <div class="form-group" style="margin-top:14px">
      <label>院内メモ</label>
      <textarea id="detail-memo" placeholder="対応内容・所見など"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-sm" id="detail-status-btn" onclick="toggleStatus()"></button>
      <button class="btn btn-outline btn-sm" onclick="saveMemo()">メモ保存</button>
      <button class="btn btn-danger btn-sm" onclick="deleteAssessment()">削除</button>
      <button class="btn btn-outline btn-sm" style="margin-left:auto" onclick="closeModal()">閉じる</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let allRows = [];
let currentDetail = null;

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

async function api(url, opts) {
  const res = await fetch(url, opts);
  if (res.status === 401) { location.href = "/admin/login"; throw new Error("unauthorized"); }
  return res.json();
}

async function doLogout() {
  await fetch("/api/admin/logout", { method: "POST" });
  location.href = "/admin/login";
}

async function loadList() {
  allRows = await api("/api/admin/assessments");
  renderList();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderList() {
  const onlyNew = document.getElementById("filter-new").checked;
  const rows = onlyNew ? allRows.filter((r) => r.status !== "done") : allRows;
  const tbody = document.getElementById("assess-tbody");
  document.getElementById("assess-empty").classList.toggle("hidden", rows.length > 0);
  tbody.innerHTML = rows.map((r) => `
    <tr style="cursor:pointer" onclick="openDetail(${r.id})">
      <td style="white-space:nowrap">${esc((r.created_at || "").slice(0, 16))}</td>
      <td><b>${esc(r.name)}</b>${r.red_flag ? ' <span class="tag" style="background:#fdecea;color:#c33">⚠︎要確認</span>' : ""}${r.has_photo ? " 📷" : ""}</td>
      <td>${esc(r.age_group || "-")}</td>
      <td style="max-width:180px">${esc(r.main_areas || "-")}</td>
      <td style="white-space:nowrap">${r.pain_now ?? "-"} / ${r.pain_worst ?? "-"}</td>
      <td>${r.posture_score ?? "-"}</td>
      <td><span class="tag ${r.status === "done" ? "tag-cancelled" : "tag-confirmed"}">${r.status === "done" ? "対応済" : "未対応"}</span></td>
    </tr>`).join("");
}

function kv(label, value) {
  return value ? `<div class="confirm-row"><dt>${esc(label)}</dt><dd style="text-align:right">${esc(value)}</dd></div>` : "";
}

async function openDetail(id) {
  const d = await api("/api/admin/assessments/" + id);
  currentDetail = d;
  document.getElementById("detail-title").textContent = `No.${d.id} ${d.name} 様`;
  const a = d.answers || {}, s = d.scores || {};
  const arr = (x) => (Array.isArray(x) && x.length ? x.join("、") : "");
  let html = `<div class="confirm-box" style="margin-bottom:12px">`;
  html += kv("受付日時", d.created_at);
  html += kv("年代／性別", [d.age_group, d.gender].filter(Boolean).join("／"));
  html += kv("連絡先", d.contact);
  html += kv("生活スタイル", arr(a.lifestyle));
  html += `</div>`;

  if ((a.red_flags || []).length) {
    html += `<div class="rf-alert" style="margin-bottom:12px"><b>⚠️ レッドフラグ該当</b><br>${esc(arr(a.red_flags))}</div>`;
  }

  html += `<div class="confirm-box" style="margin-bottom:12px">`;
  html += kv("気になる部位", arr(a.pain_areas) || "（選択なし）");
  html += kv("痛み（現在／最大）", `${s.pain_now ?? "-"} ／ ${s.pain_worst ?? "-"}（10段階）`);
  html += kv("生活支障度", s.adl != null ? s.adl + " / 10" : "");
  html += kv("痛みの性質", arr(a.pain_quality));
  html += kv("痛むタイミング", arr(a.pain_timing));
  html += kv("期間", a.pain_duration);
  html += `</div>`;

  html += `<div class="confirm-box" style="margin-bottom:12px">`;
  html += kv("姿勢スコア", (d.posture_score ?? "-") + " / 100");
  html += kv("タイプ", d.posture_type);
  html += kv("壁立ち・後頭部", a.wall_head);
  html += kv("壁立ち・腰のすき間", a.wall_lumbar);
  html += kv("肩の高さ", a.shoulder_height);
  html += kv("靴底の減り", a.shoes);
  html += kv("習慣", arr(a.habits));
  const o = s.photo_offsets;
  if (o) {
    html += kv("写真：耳/肩/股関節/膝", `${o.ear}% / ${o.shoulder}% / ${o.hip}% / ${o.knee}%（＋が前方）`);
  }
  html += `</div>`;

  if (d.photo) {
    html += `<img src="${d.photo}" style="max-width:100%;border-radius:10px" alt="姿勢写真">`;
  }
  document.getElementById("detail-body").innerHTML = html;
  document.getElementById("detail-memo").value = d.admin_memo || "";
  updateStatusBtn();
  document.getElementById("detail-modal").classList.remove("hidden");
}

function updateStatusBtn() {
  document.getElementById("detail-status-btn").textContent =
    currentDetail.status === "done" ? "未対応に戻す" : "対応済みにする";
}

async function toggleStatus() {
  const next = currentDetail.status === "done" ? "new" : "done";
  await api("/api/admin/assessments/" + currentDetail.id, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: next }),
  });
  currentDetail.status = next;
  updateStatusBtn();
  showToast(next === "done" ? "対応済みにしました" : "未対応に戻しました");
  loadList();
}

async function saveMemo() {
  await api("/api/admin/assessments/" + currentDetail.id, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ admin_memo: document.getElementById("detail-memo").value }),
  });
  showToast("メモを保存しました");
}

async function deleteAssessment() {
  if (!confirm(`No.${currentDetail.id} ${currentDetail.name}様の回答を削除しますか？`)) return;
  await api("/api/admin/assessments/" + currentDetail.id, { method: "DELETE" });
  closeModal();
  showToast("削除しました");
  loadList();
}

function closeModal() {
  document.getElementById("detail-modal").classList.add("hidden");
}

document.getElementById("detail-modal").addEventListener("click", (e) => {
  if (e.target.id === "detail-modal") closeModal();
});

loadList();
</script>
</body>
</html>
